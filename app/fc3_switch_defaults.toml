# Far Cry 3 for the Switch: the fixed settings, compiled into the NRO (app/CMakeLists.txt,
# src/fc3_app.h BuiltInConfig) and applied before the SD card's fc3.toml, which holds the player's options
# (app/fc3_switch.toml) and may still override any key here for testing. docs/enhancements.md explains each key.
# Logging and profiling are off: no logs/ folder and no profile on the SD card.

# Game and paths
license_mask = 1
fc3_renderer_native = true
fc3_render_height_handheld = 720
fc3_render_height_docked = 1080
fc3_shader_misses = ""
asset_pack = true
asset_pack_build = true

# No logging, no profiling
log_level = "off"
log_to_file = false
switch_profile_stacks = false
switch_profile_report = false
fc3_gpu_marks_categories = false

# CPU enhancements (docs/enhancements.md)
fc3_cpu_enhancements = true
fc3_cpu_gpu_wait_sleep = true
fc3_gpu_wait_max_us = 1000
fc3_cpu_ring_notify_lockfree = true
fc3_cpu_lazy_trace_text = true

# Every fc3_cpu_native_* below is OFF, and they were ON in the Sonic Adventure 2 port. Each of them named a guest
# function of that game (the Ninja matrix library, the CRT helpers, the chunk-model vertex loaders, and its own
# profile's hot addresses). Far Cry 3 has none of those addresses, so there is nothing for them to replace. The keys
# stay (the SDK reads cvars by name and an unknown key is an error at startup); they go back to true one at a time
# as app/src/cpu/hot/localized.txt gains Far Cry 3 functions from a real console profile (guia, capitulo 9.3).
fc3_cpu_native_memcpy = false
fc3_cpu_native_memset = false
fc3_cpu_native_memmove = false
fc3_cpu_native_calc_point = false
fc3_cpu_native_multi_matrix = false
fc3_cpu_native_vertex_normals = false
fc3_cpu_native_vertex_points = false
fc3_cpu_native_translate = false
fc3_cpu_native_push_matrix = false
fc3_cpu_native_rotate_x = false
