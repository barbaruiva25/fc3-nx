# A gap inside sub_83493B70: eighteen branches to 0x83494044 / 0x83494048 (its own code, fc3_recomp.326.cpp) whose
# block the Discover phase cut. codegen.partition.json puts the address under sub_83493D58, which discovery never
# made a function, so the generator wrote the gotos and not the labels:
#   error: use of undeclared label 'loc_83494048'
#
# Declaring sub_83493D58 here did NOT work (tried: bare, with parent = 0x83493B70, with end = 0x83494068; each
# codegen run leaves it out of the tree). The likely reason is phase_discover.cpp:175, which drops a branch whose
# target falls inside the function's own PDATA region: the PDATA the Xbox has for sub_83493B70 extends past
# 0x83494044, so the branch is discarded as "internal" and nothing ever reaches the function that owns that code.
#
# The two entries below are that test, not a known fix: giving sub_83493B70 an `end` before the branch target takes
# the target out of the PDATA region, so the branch is no longer skipped and discovery can reach the code. If it
# works, sub_83493D58 appears on its own and this second entry can go.
#
#   tools/fix_missing_labels.py must report "nothing missing" afterwards. If it still reports the two labels, this
#   approach failed and the fix belongs in the SDK (docs/NOTAS-DE-BUILD.md, section 9).
"0x83493B70" = { end = 0x83493D58 }
"0x83493D58" = { end = 0x83494068 }

