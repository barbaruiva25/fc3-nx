# Far Cry 3 (Xbox 360) - analysis corrections for the code generator.
#
# Empty on purpose. Every entry below belongs to Far Cry 3 alone and needs its evidence (which tool or which log
# found it), so nothing may be copied from another game's manifest.
#
# The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py                       code pointers stored in data (vtables, callback tables)
#   tools/pointer_audit.py, tools/pointer_fixpoint.py   pointers reached only through a pointer
#   tools/switch_check.py                       truncated jump tables (`switch` statements)
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log
#
# Root keys that will be needed here (address and evidence, once the game has booted once):
#   setjmp_address / longjmp_address    the CRT's setjmp and longjmp; without them r1/r31 come back corrupted
#                                       after a call that returns through longjmp
#
# Known shapes to look for, from the guide (chapter 3.2):
#   - functions reached only through pointers (CRT initializer tables, vtables, callbacks built with lis/addi)
#   - truncated jump tables ("Switch case out of range" / illegal instruction)
#   - gaps: code that exists in the XEX but no static path reaches
#   - functions that never return (abort, C++ throw): without read_before_write the translator merges the catch
#     funclet into its parent and falls through into foreign code

[functions]
